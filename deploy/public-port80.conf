# systemd drop-in: serve the dashboard publicly on port 80.
#
# !! This puts an API with NO AUTHENTICATION on the public internet. Anyone who
# !! reaches this IP can dump your open positions, retarget the bot at another
# !! wallet, wipe your stored key and erase your history. They cannot read the
# !! private key back and cannot transfer funds out, but they can trade the
# !! wallet at will if a key is stored.
# !!
# !! Pair it with the source-IP allowlist in DEPLOY.md unless you genuinely need
# !! the whole internet to reach it.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/polymarketbot.service.d
#   sudo cp deploy/public-port80.conf /etc/systemd/system/polymarketbot.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart polymarketbot
#
# Revert to localhost-only:
#   sudo rm /etc/systemd/system/polymarketbot.service.d/public-port80.conf
#   sudo systemctl daemon-reload && sudo systemctl restart polymarketbot

[Service]
# A Type=simple unit accepts one ExecStart, so the inherited command must be
# cleared before the replacement is set.
ExecStart=
ExecStart=/opt/ploymarketbot/.venv/bin/python run.py --no-browser --host 0.0.0.0 --port 80

# Port 80 is privileged and the service runs as an unprivileged user, so grant
# just the one capability needed to bind it — not root.
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
